monorepo_root = true

[monorepo]
config_roots = ["db", "data-sync", "cluetooth-core", "scanner"]

[tools]
python = "3.14"
uv = "latest"
node = "24.22.0"                          # scanner wiki-bundle exporter
dbmate = "2.32.0"
gcloud = "587.0.0"
"aqua:cloudflare/cloudflared" = "2026.10.0"   # db:connect
java = "temurin-17.0.20+8"
android-sdk = "19.0"
rust = { version = "1.96.1", profile = "minimal", components = ["clippy", "rustfmt"] }
"aqua:mozilla/sccache" = "0.19.0"          # compiler cache shared by every worktree (RUSTC_WRAPPER below)

[env]
# Keep rustup operations and cargo installs out of the user's global toolchains.
MISE_RUSTUP_HOME = "{{env.HOME}}/.local/share/mise/newcluetooth/rustup"
MISE_CARGO_HOME = "{{env.HOME}}/.local/share/mise/newcluetooth/cargo"
RUSTUP_HOME = "{{env.HOME}}/.local/share/mise/newcluetooth/rustup"
CARGO_HOME = "{{env.HOME}}/.local/share/mise/newcluetooth/cargo"
# Bound Polars compilation memory without changing global Cargo configuration (~1-2 GB per job).
CARGO_BUILD_JOBS = "6"
# Every worktree has its own target/, so a fresh worktree used to rebuild Polars from scratch
# (~50 min). sccache caches rustc output across worktrees; incremental builds are not cacheable.
RUSTC_WRAPPER = "sccache"
SCCACHE_DIR = "{{env.HOME}}/.cache/sccache/newcluetooth"
SCCACHE_CACHE_SIZE = "20G"
CARGO_INCREMENTAL = "0"
# sdkmanager packages/licenses belong to this project, not a shared SDK install.
ANDROID_HOME = "{{env.HOME}}/.local/share/mise/newcluetooth/android-sdk"
ANDROID_SDK_ROOT = "{{env.HOME}}/.local/share/mise/newcluetooth/android-sdk"

[tasks."db:connect"]
description = "Forward the scan database to 127.0.0.1:${DB_LOCAL_PORT:-15432} through Cloudflare Access (browser login on first use)"
raw = true
run = 'cloudflared access tcp --hostname db.wirelesswiki.org --url "127.0.0.1:${DB_LOCAL_PORT:-15432}"'

[tasks.install]
description = "Install locked Python dependencies (run mise install for tool binaries first)"
depends = ["//data-sync:install"]

[tasks.check]
description = "Host checks: Rust, Android JVM, Python/Parquet interoperability and disposable DB (Docker required); no APK/device/upload"
# Serialize the heavyweight host stages instead of compiling Polars and Gradle together.
run = ["mise run //cluetooth-core:check", "mise run //scanner:check", "mise run //data-sync:check"]

[tasks.native-check]
description = "Build the Android API-24 native ABIs in CLUETOOTH_ABIS (default arm64-v8a); separate from host tests and product APKs"
depends = ["//cluetooth-core:build-android"]

# Research agent fleet (infra/fleet): Gitea, runners, tunnel, keyproxy, research agent.
# Secrets stay in ~/.config/cluetooth-fleet/secrets (FLEET_SECRETS_DIR); see infra/fleet/README.md.
[tasks."fleet:secrets"]
description = "Check the fleet's secret files exist with mode 600 (prints names and modes, never contents)"
run = "infra/fleet/fleet.sh secrets"

[tasks."fleet:build"]
description = "Build the runner, keyproxy and research-agent images (the agent with zstd layers)"
run = "infra/fleet/fleet.sh build"

[tasks."fleet:up"]
description = "Check secrets, then start the fleet (compose projects wirelesswiki-gitea and research-agent)"
run = "infra/fleet/fleet.sh up"

[tasks."fleet:down"]
description = "Stop and remove the fleet's containers (volumes and host data are kept)"
run = "infra/fleet/fleet.sh down"

[tasks."fleet:status"]
description = "Show the fleet's containers, keyproxy health and today's WiGLE budget"
run = "infra/fleet/fleet.sh status"

[tasks."fleet:logs"]
description = "Follow one fleet service's logs: mise run fleet:logs <service>"
usage = 'arg "<service>" help="gitea, cloudflared, runner-1..4, keyproxy or research-agent"'
run = 'infra/fleet/fleet.sh logs {{arg(name="service")}}'

[tasks."fleet:test"]
description = "keyproxy and agent tool tests (node --test, no network, no Docker)"
run = [
  "cd infra/fleet/keyproxy && node --test 'test/*.test.mjs'",
  "cd infra/fleet/agent-image && node --test tools/wigle/test/*.test.mjs tools/gitea-watch/test/*.test.mjs",
]

[tasks."fleet:config"]
description = "Render the fleet compose file (all profiles) without resolving env files, so no secret is printed"
run = "infra/fleet/fleet.sh config"

[tasks."fleet:register-runners"]
description = "Register the four Gitea runners once (needs gitea-runner-registration-token in the secrets dir)"
run = "infra/fleet/fleet.sh register-runners"
