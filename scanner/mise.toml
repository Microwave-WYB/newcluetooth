[tasks.sdk-install]
description = "Install host SDK platform35/build-tools35.0.0 only; licenses must be manually accepted first"
run = ['sdkmanager --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0" </dev/null', 'mise run //scanner:sdk-check']

[tasks.native-sdk-install]
description = "Explicit native-only NDK27.2.12479018 installation; no license acceptance"
run = ['sdkmanager --sdk_root="$ANDROID_HOME" "ndk;27.2.12479018" </dev/null', 'test -f "$ANDROID_HOME/ndk/27.2.12479018/source.properties" || { echo "NDK installation incomplete; review licenses/setup manually" >&2; exit 1; }']

[tasks.sdk-check]
description = "Fail clearly if host SDK platform/build-tools are missing; no download/license acceptance"
run = 'test -f "$ANDROID_HOME/platforms/android-35/android.jar" && test -f "$ANDROID_HOME/build-tools/35.0.0/source.properties" || { echo "Missing project Android SDK platform35/build-tools35.0.0; follow the manual license/setup steps in scanner/README.md" >&2; exit 1; }'

[tasks.test]
description = "Host JVM tests only: compile real bindings, no Firebase processing, native packaging, APK or device"
depends = ["sdk-check"]
run = "./gradlew --no-daemon --max-workers=2 -PcluetoothHostChecks=true :app:testDebugUnitTest -x :app:buildCluetoothCoreAndroid"

[tasks.lint]
description = "Host Android lint without Firebase credentials or native packaging"
depends = ["sdk-check"]
run = "./gradlew --no-daemon --max-workers=2 -PcluetoothHostChecks=true :app:lintDebug -x :app:buildCluetoothCoreAndroid"

[tasks.host-guard-check]
description = "Prove unrelated task selectors fail before execution in host-only mode"
run = '''
if output=$(./gradlew --no-daemon --max-workers=2 -PcluetoothHostChecks=true help 2>&1); then
  printf '%s\n' "$output"; echo "Host guard failed: help was accepted" >&2; exit 1
fi
printf '%s\n' "$output"
case "$output" in *"cluetoothHostChecks requires literal true"*) ;; *) exit 1 ;; esac
'''

[tasks.wiki-bundle-install]
description = "Install the exporter's locked Node dependencies (yaml); no scripts run"
dir = "tools/wiki-bundle"
run = "npm ci --ignore-scripts --no-audit --no-fund"

[tasks.wiki-bundle-test]
description = "Unit tests of the wiki bundle exporter (Node's built-in test runner)"
depends = ["wiki-bundle-install"]
dir = "tools/wiki-bundle"
run = "node --test"

[tasks.wiki-bundle]
description = "Export a Wireless Wiki checkout (WIKI_DIR, default ~/Projects/wiki-snapshot) into app/src/main/assets/wiki-bundle.json"
depends = ["wiki-bundle-install"]
dir = "tools/wiki-bundle"
run = 'node export-bundle.mjs --wiki "${WIKI_DIR:-$HOME/Projects/wiki-snapshot}"'

[tasks.design-export]
description = "Regenerate design/ui-v2/tokens.json and map-style.json from tokens.css and map-style.js"
run = "node design/ui-v2/export.mjs"

[tasks.design-export-check]
description = "Fail if the committed design/ui-v2 JSON exports are out of date"
run = "node design/ui-v2/export.mjs --check"

[tasks.core-test]
description = "Lane A's v2 Kotlin modules: JVM tests of :core-api (and later :core-fake, :core-bridge)"
run = "./gradlew --no-daemon --max-workers=2 :core-api:test"

[tasks.platform-test]
description = "Lane B's v2 modules: JVM tests of :platform-api, :platform-fake and :platform, and the :gallery compile"
run = "./gradlew --no-daemon --max-workers=2 :platform-api:testDebugUnitTest :platform-fake:testDebugUnitTest :platform:testDebugUnitTest :gallery:compileDebugKotlin"

[tasks.check]
run = ["mise run //scanner:host-guard-check", "mise run //scanner:design-export-check", "mise run //scanner:wiki-bundle-test", "mise run //scanner:test", "mise run //scanner:platform-test", "mise run //scanner:lint"]

[tasks.build]
description = "Product debug APKs (requires matching .debug Firebase client); no install or launch"
run = "./gradlew --no-daemon --max-workers=2 :app:assembleDebug"

[tasks.build-release]
description = "Product release APKs (explicit Firebase config; optional private signing); no install or launch"
run = "./gradlew --no-daemon --max-workers=2 :app:assembleRelease"

[tasks.device-smoke]
description = "OPT-IN ONLY: installs/launches on a device; app startup can schedule Firebase uploads"
run = 'test "${CLUETOOTH_ALLOW_DEVICE_SMOKE:-}" = 1 || { echo "Device smoke requires CLUETOOTH_ALLOW_DEVICE_SMOKE=1 and a separately reviewed offline app/network setup" >&2; exit 1; }; ./gradlew --no-daemon --max-workers=2 :app:connectedCluetoothCoreSmokeTest'

[tasks.ui-shots]
description = "Render the v3 UI @Previews (light/dark, fake data) and write PNGs + index.html to $1 (Compose Preview Screenshot Testing needs JDK 21 for layoutlib; no device, no Firebase)"
usage = 'arg "<out_dir>" help="Directory for the PNGs and index.html"'
run = '''
J21=$(mise where java@temurin-21)
JAVA_HOME="$J21" PATH="$J21/bin:$PATH" ./gradlew --no-daemon --max-workers=2 :app:updateDebugScreenshotTest -x :app:buildCluetoothCoreAndroid
python3 tools/ui-gallery.py app/src/screenshotTestDebug/reference "$usage_out_dir"
'''
