[package]
name = "cluetooth-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
publish = false

[lib]
name = "cluetooth_core"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen-cli"]

[features]
default = []
bindgen-cli = ["uniffi/cli"]

[dependencies]
crypto_box = { version = "=0.9.1", default-features = false, features = ["getrandom", "salsa20", "seal", "std"] }
getrandom = "=0.4.3"
polars = { version = "=0.55.1", default-features = false, features = ["dtype-datetime", "lazy", "parquet", "strings", "temporal", "timezones"] }
polars-parquet = { version = "=0.55.1", default-features = false, features = ["zstd"] }
crc32fast = "=1.5.0"
rustix = { version = "=1.1.4", features = ["fs"] }
hex = "=0.4.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
tempfile = "=3.25.0"
thiserror = "=2.0.18"
uniffi = { version = "=0.32.0", default-features = false }
uuid = { version = "=1.22.0", default-features = false, features = ["std"] }
x25519-dalek = { version = "=2.0.1", default-features = false }

[profile.release]
# Remove static symbols/debug sections while retaining the dynamic UniFFI exports.
# Keep Cargo's default unwind panic strategy so FFI calls can return controlled errors.
strip = "symbols"
