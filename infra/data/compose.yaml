# Run from this directory (or pass -f infra/data/compose.yaml). The project
# name is pinned to the one the stack had at the repository root, so the
# network and volume names (newcluetooth_postgres-data, ...) do not change.
# COMPOSE_PROJECT_NAME still overrides it.
name: newcluetooth

services:
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    image: cluetooth-postgis:18-3.6
    container_name: cluetooth-db
    environment:
      POSTGRES_DB: cluetooth
      POSTGRES_USER: cluetooth
      POSTGRES_PASSWORD: infra_wireless_scanning
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"   # loopback only; remote access via db.wirelesswiki.org (Cloudflare Access)
    volumes:
      - ${CLUETOOTH_POSTGRES_DATA_SOURCE:-postgres-data}:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    image: ghcr.io/amacneil/dbmate:latest
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../db/db/migrations:/db/migrations:ro
    command:
      - --url
      - postgresql://cluetooth:infra_wireless_scanning@postgres:5432/cluetooth?sslmode=disable
      - --migrations-dir
      - /db/migrations
      - up
    restart: "no"

  sync:
    profiles:
      - manual
    build:
      context: ../../data-sync
      dockerfile: Dockerfile
    image: cluetooth-sync:latest
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      CLUETOOTH_DATABASE_URL: postgresql://cluetooth:infra_wireless_scanning@postgres:5432/cluetooth?sslmode=disable
      CLUETOOTH_BUCKET: ${CLUETOOTH_BUCKET:-cluetooth-1da02.firebasestorage.app}
      CLUETOOTH_PREFIX: ${CLUETOOTH_PREFIX:-scans/ gatt/}
      CLUETOOTH_PRIVATE_KEY_PATH: /run/secrets/cluetooth-private-key
      CLUETOOTH_MIRROR_DIR: /mirror
      CLUETOOTH_DOWNLOAD_WORKERS: ${CLUETOOTH_DOWNLOAD_WORKERS:-4}
      CLUETOOTH_INGEST_WORKERS: ${CLUETOOTH_INGEST_WORKERS:-2}
      CLUETOOTH_QUEUE_SIZE: ${CLUETOOTH_QUEUE_SIZE:-0}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-service-account
    volumes:
      - ${CLUETOOTH_HOST_MIRROR_DIR:-../../downloads}:/mirror
    secrets:
      - cluetooth-private-key
      - google-service-account
    restart: "no"

  sync-continuous:
    build:
      context: ../../data-sync
      dockerfile: Dockerfile
    image: cluetooth-sync:latest
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      CLUETOOTH_DATABASE_URL: postgresql://cluetooth:infra_wireless_scanning@postgres:5432/cluetooth?sslmode=disable
      CLUETOOTH_BUCKET: ${CLUETOOTH_BUCKET:-cluetooth-1da02.firebasestorage.app}
      CLUETOOTH_PREFIX: ${CLUETOOTH_PREFIX:-scans/ gatt/}
      CLUETOOTH_PRIVATE_KEY_PATH: /run/secrets/cluetooth-private-key
      CLUETOOTH_MIRROR_DIR: /mirror
      CLUETOOTH_DOWNLOAD_WORKERS: ${CLUETOOTH_DOWNLOAD_WORKERS:-4}
      CLUETOOTH_INGEST_WORKERS: ${CLUETOOTH_INGEST_WORKERS:-2}
      CLUETOOTH_QUEUE_SIZE: ${CLUETOOTH_QUEUE_SIZE:-0}
      CLUETOOTH_POLL_INTERVAL_SECONDS: ${CLUETOOTH_POLL_INTERVAL_SECONDS:-30}
      CLUETOOTH_HEARTBEAT_PATH: /tmp/cluetooth-sync/heartbeat.json
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-service-account
    volumes:
      - ${CLUETOOTH_HOST_MIRROR_DIR:-../../downloads}:/mirror
    secrets:
      - cluetooth-private-key
      - google-service-account
    healthcheck:
      # Fresh heartbeat (rewritten every 15s) and fewer than 5 consecutive
      # cycle errors.
      test: ["CMD", "cluetooth", "health", "--max-age-seconds", "120"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped

  wigle-upload:
    profiles:
      - manual
    build:
      context: ../../data-sync
      dockerfile: Dockerfile
    image: cluetooth-sync:latest
    entrypoint: ["cluetooth"]
    command: ["wigle", "upload"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      CLUETOOTH_DATABASE_URL: postgresql://cluetooth:infra_wireless_scanning@postgres:5432/cluetooth?sslmode=disable
      CLUETOOTH_WIGLE_BATCH_SIZE: ${CLUETOOTH_WIGLE_BATCH_SIZE:-50000}
      WIGLE_API_KEY: ${WIGLE_API_KEY:-}
    restart: "no"

  # Opt-in (profile pgweb): a read-only SQL browser on simi's loopback. Not running today; the
  # owner's planned dashboard is Grafana at dash.wirelesswiki.org. The connection string (use a
  # read-only role such as wiki_ro) is a secret file, never an environment value in this file.
  pgweb:
    profiles:
      - pgweb
    image: sosedoff/pgweb:0.17.0
    container_name: cluetooth-pgweb
    depends_on:
      postgres:
        condition: service_healthy
    # The secret file is mode 600 and owned by the host account that runs compose.
    user: "${CLUETOOTH_HOST_UID:-1000}:${CLUETOOTH_HOST_GID:-1000}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'PGWEB_DATABASE_URL="$$(cat /run/secrets/pgweb-database-url)" exec pgweb --bind=0.0.0.0 --listen=8081 --readonly'
    ports:
      - "127.0.0.1:${PGWEB_PORT:-8081}:8081"
    secrets:
      - pgweb-database-url
    restart: unless-stopped

  # Opt-in (profile db-tunnel): db.wirelesswiki.org on its own Cloudflare tunnel. TODAY THAT
  # ROUTE IS SERVED BY THE FLEET'S TUNNEL (infra/fleet, wirelesswiki-gitea-cloudflared-1, which
  # joins this project's network and forwards db.wirelesswiki.org to tcp://cluetooth-db:5432
  # behind a Cloudflare Access app). Enable this only after creating a separate tunnel whose
  # token is in secrets/db-tunnel-token and moving the db route to it.
  db-tunnel:
    profiles:
      - db-tunnel
    image: cloudflare/cloudflared:2026.10.0
    container_name: cluetooth-db-tunnel
    command: [tunnel, --no-autoupdate, run, --token-file, /run/secrets/db-tunnel-token]
    user: "${CLUETOOTH_HOST_UID:-1000}:${CLUETOOTH_HOST_GID:-1000}"
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - db-tunnel-token
    restart: unless-stopped

  # The AndroZoo APK list in Postgres (androzoo.apks). Profile androzoo; a daily check at
  # ANDROZOO_SYNC_AT (UTC) HEADs the list and, if ETag/Last-Modified/Content-Length changed,
  # downloads it in 10 range segments, COPYs it into staging and swaps the table in one
  # transaction. The list is public: no AndroZoo key. Manual run and the one-off first load:
  # `mise run //infra/data:androzoo-sync`, `mise run //infra/data:androzoo-initial-load`.
  androzoo-sync:
    profiles:
      - androzoo
    build:
      context: ./androzoo
    image: cluetooth-androzoo-sync:latest
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      ANDROZOO_DATABASE_URL: postgresql://cluetooth:infra_wireless_scanning@postgres:5432/cluetooth?sslmode=disable
      ANDROZOO_LIST_URL: ${ANDROZOO_LIST_URL:-https://androzoo.uni.lu/static/lists/latest.csv.gz}
      ANDROZOO_DATA_DIR: /var/lib/androzoo-sync
      ANDROZOO_SYNC_AT: ${ANDROZOO_SYNC_AT:-03:30}
      ANDROZOO_SEGMENTS: ${ANDROZOO_SEGMENTS:-10}
    volumes:
      # Its own download directory, outside the agents' workspace; holds only the newest list.
      - ${ANDROZOO_DATA_SOURCE:-androzoo-data}:/var/lib/androzoo-sync
    restart: unless-stopped

volumes:
  postgres-data:
  androzoo-data:

secrets:
  cluetooth-private-key:
    file: ./secrets/private-key.txt
  google-service-account:
    file: ./secrets/service-account-key.json
  # Only needed by the opt-in services above.
  pgweb-database-url:
    file: ./secrets/pgweb-database-url
  db-tunnel-token:
    file: ./secrets/db-tunnel-token
